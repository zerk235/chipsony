name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# VK не даёт два деплоя одного приложения одновременно — выстраиваем в очередь
concurrency:
  group: vk-deploy-54788608-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Собрать проект
        run: npm run build

      - name: Подготовить конфиг без вопросов
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('vk-hosting-config.json','utf8'));c.noprompt=true;c.update_prod=true;c.update_dev=false;fs.writeFileSync('vk-hosting-config.json',JSON.stringify(c,null,2));"

      - name: Проверить секрет
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_DEPLOY_TOKEN }}
        run: |
          {
            echo "длина секрета: ${#MINI_APPS_ACCESS_TOKEN}"
            echo "префикс: ${MINI_APPS_ACCESS_TOKEN:0:6}"
          } | tee secret.log

      - name: Залить на VK-хостинг
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_DEPLOY_TOKEN }}
          MINI_APPS_APP_ID: 54788608
        run: |
          set +e
          : > deploy.log
          for i in 1 2 3 4; do
            echo "--- попытка $i из 4 ---" >> deploy.log
            timeout 150 npx vk-miniapps-deploy < /dev/null >> deploy.log 2>&1
            code=$?
            [ $code -eq 0 ] && break
            if [ $i -lt 4 ]; then
              echo "не удалось (код $code), повтор через 20 сек" >> deploy.log
              sleep 20
            fi
          done
          cat deploy.log
          {
            echo '### Вывод деплоя'
            echo '```'
            cat deploy.log
            echo '```'
            if [ $code -ne 0 ]; then
              echo ''
              echo '**Деплой не удался после 3 попыток.**'
              echo 'Частая причина — временная ошибка VK `Access denied: invalid file`, лечится повтором.'
              echo 'Если в тексте ошибки про токен — обнови секрет VK_DEPLOY_TOKEN.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Сохранить лог в ветку logs
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p logs
          cp deploy.log "logs/$(date -u +%Y%m%d-%H%M%S)-prod.txt"
          cp secret.log "logs/secret-check-prod.txt"
          cd logs
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -q -m "deploy log ${{ github.sha }}" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/logs || true
