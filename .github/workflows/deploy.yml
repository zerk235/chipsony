name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# VK не даёт два деплоя одного приложения одновременно — выстраиваем в очередь
concurrency:
  group: vk-deploy-54788608
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Собрать проект
        run: npm run build

      - name: Подготовить конфиг без вопросов
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('vk-hosting-config.json','utf8'));c.noprompt=true;c.update_prod=true;c.update_dev=true;fs.writeFileSync('vk-hosting-config.json',JSON.stringify(c,null,2));"

      - name: Проверить секрет
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_DEPLOY_TOKEN }}
        run: |
          {
            echo "длина секрета: ${#MINI_APPS_ACCESS_TOKEN}"
            echo "префикс: ${MINI_APPS_ACCESS_TOKEN:0:6}"
          } | tee secret.log

      - name: Залить на VK-хостинг
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_DEPLOY_TOKEN }}
          MINI_APPS_APP_ID: 54788608
        run: |
          set +e
          npx vk-miniapps-deploy > deploy.log 2>&1
          code=$?
          cat deploy.log
          {
            echo '### Вывод деплоя'
            echo '```'
            cat deploy.log
            echo '```'
            if [ $code -ne 0 ]; then
              echo ''
              echo '**Деплой не удался.** В 9 случаях из 10 истёк токен доступа VK.'
              echo 'Обновить: Settings → Secrets and variables → Actions → VK_DEPLOY_TOKEN.'
              echo 'Новое значение: файл `~/.config/configstore/@vkontakte/vk-miniapps-deploy.json`, поле `access_token`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Сохранить лог в ветку logs
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p logs
          cp deploy.log "logs/$(date -u +%Y%m%d-%H%M%S)-prod.txt"
          cp secret.log "logs/secret-check-prod.txt"
          cd logs
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -q -m "deploy log ${{ github.sha }}" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/logs || true
