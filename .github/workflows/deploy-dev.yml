name: Deploy dev version

on:
  push:
    branches: [dev]
  workflow_dispatch:

# VK не даёт два деплоя одного приложения одновременно — выстраиваем в очередь
concurrency:
  group: vk-deploy-54788608
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Собрать проект
        run: npm run build

      - name: Подготовить конфиг (только тестовая версия)
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('vk-hosting-config.json','utf8'));c.noprompt=true;c.update_prod=false;c.update_dev=true;fs.writeFileSync('vk-hosting-config.json',JSON.stringify(c,null,2));"

      - name: Залить тестовую версию
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_DEPLOY_TOKEN }}
          MINI_APPS_APP_ID: 54788608
        run: |
          set +e
          npx vk-miniapps-deploy > deploy.log 2>&1
          code=$?
          cat deploy.log
          {
            echo '### Вывод деплоя'
            echo '```'
            cat deploy.log
            echo '```'
            if [ $code -ne 0 ]; then
              echo ''
              echo '**Деплой не удался.** В 9 случаях из 10 истёк токен доступа VK.'
              echo 'Обновить: Settings → Secrets and variables → Actions → VK_DEPLOY_TOKEN.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
